name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR番号（手動実行時）'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post "building" comment
        uses: actions/github-script@v7
        id: building_comment
        with:
          script: |
            const pr  = context.payload.pull_request;
            const prNumber = pr ? pr.number : parseInt('${{ inputs.pr_number || 0 }}', 10);
            if (!prNumber) { core.setOutput('comment_id', ''); return; }

            const body = [
              '## プレビュー',
              '',
              '_ビルド中... しばらくお待ちください。_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## プレビュー')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.setOutput('comment_id', String(existing.id));
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.setOutput('comment_id', String(created.id));
            }

      - name: Compute preview path
        id: preview
        run: |
          SAFE=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "path=preview/$SAFE" >> $GITHUB_OUTPUT
          echo "url=https://snowfairytea.dev/preview/$SAFE/" >> $GITHUB_OUTPUT

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build
        run: bundle exec jekyll build --baseurl "/${{ steps.preview.outputs.path }}"
        env:
          JEKYLL_ENV: production

      - name: Deploy preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: ${{ steps.preview.outputs.path }}
          keep_files: true

      - name: Post / update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const pr  = context.payload.pull_request;
            const prNumber = pr ? pr.number : parseInt('${{ inputs.pr_number || 0 }}', 10);
            if (!prNumber) { console.log('PR番号なし、スキップ'); return; }
            const sha = pr ? pr.head.sha.slice(0, 7) : context.sha.slice(0, 7);
            const now = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
            const body = [
              '## プレビュー',
              '',
              `**[${url}](${url})**`,
              '',
              `Branch: \`${{ github.head_ref || github.ref_name }}\` @ \`${sha}\``,
              `最終更新: ${now}`,
              '',
              '_コミットのたびに自動更新。PRクローズ時にプレビューは削除されます。_',
            ].join('\n');

            const commentId = parseInt('${{ steps.building_comment.outputs.comment_id }}', 10);
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Compute preview path
        id: preview
        run: |
          SAFE=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "path=preview/$SAFE" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        id: checkout_ghpages
        continue-on-error: true
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove preview directory
        if: steps.checkout_ghpages.outcome == 'success'
        run: |
          PREVIEW_PATH="${{ steps.preview.outputs.path }}"
          if [ -d "$PREVIEW_PATH" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PREVIEW_PATH"
            git commit -m "chore: remove preview for ${{ github.head_ref }}"
            git push
          else
            echo "Preview directory not found, skipping"
          fi
