name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute preview path
        id: preview
        run: |
          SAFE=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "path=preview/$SAFE" >> $GITHUB_OUTPUT
          echo "url=https://snowfairytea.dev/preview/$SAFE/" >> $GITHUB_OUTPUT

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build
        run: bundle exec jekyll build --baseurl "/${{ steps.preview.outputs.path }}"
        env:
          JEKYLL_ENV: production

      - name: Deploy preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: ${{ steps.preview.outputs.path }}
          keep_files: true

      - name: Post / update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const sha  = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              '## プレビュー',
              '',
              `**[${url}](${url})**`,
              '',
              `Branch: \`${{ github.head_ref }}\` @ \`${sha}\``,
              '',
              '_コミットのたびに自動更新。PRクローズ時にプレビューは削除されます。_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## プレビュー')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Compute preview path
        id: preview
        run: |
          SAFE=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "path=preview/$SAFE" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        id: checkout_ghpages
        continue-on-error: true
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove preview directory
        if: steps.checkout_ghpages.outcome == 'success'
        run: |
          PREVIEW_PATH="${{ steps.preview.outputs.path }}"
          if [ -d "$PREVIEW_PATH" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PREVIEW_PATH"
            git commit -m "chore: remove preview for ${{ github.head_ref }}"
            git push
          else
            echo "Preview directory not found, skipping"
          fi
