<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スライドビューアー</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111827;
      color: #f1f5f9;
      display: flex; flex-direction: column;
    }

    /* ── Navbar ── */
    #navbar {
      height: 48px; flex-shrink: 0;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex; align-items: center; gap: 6px;
      padding: 0 12px;
    }
    #btn-back {
      text-decoration: none; color: #94a3b8;
      padding: 5px 10px; border-radius: 6px; font-size: 14px;
      white-space: nowrap; transition: background .15s, color .15s;
    }
    #btn-back:hover { background: #1e293b; color: #f1f5f9; }
    .sep { width: 1px; height: 24px; background: #1e293b; margin: 0 2px; flex-shrink: 0; }
    .nav-btn {
      background: transparent; border: none; color: #94a3b8;
      width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
      cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
    }
    .nav-btn:hover:not(:disabled) { background: #1e293b; color: #f1f5f9; }
    .nav-btn:disabled { opacity: .3; cursor: default; }
    #page-info {
      font-size: 13px; color: #94a3b8;
      min-width: 72px; text-align: center; flex-shrink: 0;
      user-select: none;
    }
    #deck-title {
      font-size: 13px; color: #475569;
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding: 0 8px;
    }

    /* ── Main ── */
    #main {
      flex: 1; overflow: hidden; position: relative;
      display: flex; align-items: center; justify-content: center;
      background: #1f2937;
    }
    #pdf-canvas { max-width: 100%; max-height: 100%; display: block; }
    #html-frame { width: 100%; height: 100%; border: none; display: block; }

    #overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #1f2937;
    }
    #overlay.hidden { display: none; }
    .status-text { color: #6b7280; font-size: 14px; }

    #error-box { text-align: center; padding: 40px; }
    #error-box h2 { font-size: 1.1rem; color: #f87171; margin-bottom: 10px; }
    #error-box p  { font-size: 14px; color: #9ca3af; }
  </style>
</head>
<body>

<nav id="navbar">
  <a href="./" id="btn-back">← 一覧</a>
  <div class="sep"></div>
  <button id="btn-prev" class="nav-btn" disabled title="前のページ (←)">&#9664;</button>
  <span id="page-info">—</span>
  <button id="btn-next" class="nav-btn" disabled title="次のページ (→)">&#9654;</button>
  <div class="sep"></div>
  <button id="btn-fs" class="nav-btn" title="全画面">&#x26F6;</button>
  <span id="deck-title"></span>
</nav>

<main id="main">
  <div id="overlay">
    <span id="overlay-text" class="status-text">読み込み中…</span>
    <div id="error-box" style="display:none">
      <h2>読み込みエラー</h2>
      <p id="error-msg"></p>
    </div>
  </div>
  <canvas id="pdf-canvas" style="display:none"></canvas>
  <iframe id="html-frame" style="display:none" allow="fullscreen" allowfullscreen></iframe>
</main>

<script>
const PDFJS_CDN    = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
const PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

// ── DOM refs ──
const elOverlay  = document.getElementById('overlay');
const elOvText   = document.getElementById('overlay-text');
const elErrBox   = document.getElementById('error-box');
const elErrMsg   = document.getElementById('error-msg');
const elCanvas   = document.getElementById('pdf-canvas');
const elFrame    = document.getElementById('html-frame');
const elPageInfo = document.getElementById('page-info');
const elTitle    = document.getElementById('deck-title');
const btnPrev    = document.getElementById('btn-prev');
const btnNext    = document.getElementById('btn-next');
const btnFs      = document.getElementById('btn-fs');

// ── State ──
let pdfDoc      = null;
let currentPage = 1;
let rendering   = false;
let pending     = false;

// ── Helpers ──
function showError(msg) {
  elOvText.style.display = 'none';
  elErrBox.style.display = '';
  elErrMsg.textContent = msg;
}

function hideOverlay() {
  elOverlay.classList.add('hidden');
}

// ── PDF.js ──
async function loadPdfJs() {
  if (window['pdfjs-dist/build/pdf']) return window['pdfjs-dist/build/pdf'];
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = PDFJS_CDN; s.onload = res;
    s.onerror = () => rej(new Error('PDF.js の読み込みに失敗しました'));
    document.head.appendChild(s);
  });
  const lib = window['pdfjs-dist/build/pdf'];
  lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  return lib;
}

async function renderPage(n) {
  if (!pdfDoc) return;
  if (rendering) { pending = true; return; }
  rendering = true; pending = false;

  try {
    const page = await pdfDoc.getPage(n);
    const main = document.getElementById('main');
    const W = main.clientWidth, H = main.clientHeight;
    const vp0   = page.getViewport({ scale: 1 });
    const scale = Math.min(W / vp0.width, H / vp0.height) * 0.97;
    const vp    = page.getViewport({ scale });

    elCanvas.width  = vp.width;
    elCanvas.height = vp.height;
    await page.render({ canvasContext: elCanvas.getContext('2d'), viewport: vp }).promise;

    elPageInfo.textContent = `${n} / ${pdfDoc.numPages}`;
    btnPrev.disabled = n <= 1;
    btnNext.disabled = n >= pdfDoc.numPages;
  } finally {
    rendering = false;
    if (pending) renderPage(currentPage);
  }
}

function prevPage() { if (currentPage > 1) renderPage(--currentPage); }
function nextPage() { if (pdfDoc && currentPage < pdfDoc.numPages) renderPage(++currentPage); }

async function initPdf(url) {
  const lib  = await loadPdfJs();
  pdfDoc     = await lib.getDocument(url).promise;
  hideOverlay();
  elCanvas.style.display = 'block';
  btnNext.disabled = pdfDoc.numPages <= 1;
  await renderPage(1);
}

// ── HTML (Reveal.js) ──
function initHtml(url) {
  hideOverlay();
  elFrame.src = url;
  elFrame.style.display = 'block';
  elPageInfo.textContent = 'HTML';
}

// ── PPTX (Office Online) ──
function initPptx(deckFile) {
  const base = window.location.origin + '/apps/slides/decks/';
  const src  = 'https://view.officeapps.live.com/op/view.aspx?src=' +
               encodeURIComponent(base + encodeURIComponent(deckFile));
  hideOverlay();
  elFrame.src = src;
  elFrame.style.display = 'block';
  elPageInfo.textContent = 'PPTX';
}

// ── Init ──
async function init() {
  const deckFile = new URLSearchParams(location.search).get('deck');
  if (!deckFile) { showError('?deck= パラメータが指定されていません'); return; }

  let manifest;
  try {
    const res = await fetch('./decks/manifest.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    manifest = await res.json();
  } catch (e) {
    showError(`manifest.json の読み込みに失敗しました: ${e.message}`);
    return;
  }

  const entry = manifest.find(d => d.file === deckFile);
  if (!entry) { showError(`デッキ "${deckFile}" が見つかりません`); return; }

  document.title = `${entry.title} — スライドビューアー`;
  elTitle.textContent = entry.title;

  try {
    if      (entry.type === 'pdf')  await initPdf(`./decks/${deckFile}`);
    else if (entry.type === 'html')       initHtml(`./decks/${deckFile}`);
    else if (entry.type === 'pptx')       initPptx(deckFile);
    else showError(`非対応のファイル形式: ${entry.type}`);
  } catch (e) {
    showError(e.message || String(e));
  }
}

// ── Event listeners ──
btnPrev.addEventListener('click', prevPage);
btnNext.addEventListener('click', nextPage);

btnFs.addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});

document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowLeft'  || e.key === 'PageUp')                prevPage();
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
    e.preventDefault(); nextPage();
  }
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (pdfDoc) renderPage(currentPage); }, 150);
});

init();
</script>
</body>
</html>
