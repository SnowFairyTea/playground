<h1 id="image_cropper_tool">image_cropper_tool</h1>

<p>画像をアップロードして矩形範囲を指定すると、その矩形の四隅座標を取得できる</p>

<h2 id="旧版との差分-v2">旧版との差分 (v2)</h2>

<ul>
  <li>複数ファイルの一括読み込みとサムネイル一覧に対応</li>
  <li>1つの範囲指定を全ファイルへ適用できる</li>
  <li>座標の数値入力パネルを追加し、手入力で微調整できる</li>
  <li>変更と同時に自動でトリミング結果を更新する</li>
  <li>トリミング結果のギャラリー表示と個別ダウンロードに対応</li>
  <li>全トリミング結果のまとめダウンロード（ZIP）に対応</li>
</ul>
