<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg); color: var(--text);
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }
  h1 { margin: 0 0 20px; font-size: 1.5rem; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .deck-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex; flex-direction: column;
    transition: box-shadow .2s, transform .2s;
  }
  .deck-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }

  .thumb-wrap {
    width: 100%; aspect-ratio: 16/9;
    background: var(--surface);
    overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb-wrap canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: auto;
  }
  .thumb-wrap iframe {
    position: absolute; top: 0; left: 0;
    border: none; pointer-events: none;
    transform-origin: top left;
  }
  .thumb-icon { font-size: 2.5rem; }

  .card-body { padding: 12px 14px; }
  .card-title { font-size: .95rem; font-weight: 600; margin: 0 0 5px; line-height: 1.3; }
  .badge {
    font-size: .72rem; color: var(--muted);
    background: var(--surface); display: inline-block;
    padding: 2px 8px; border-radius: var(--radius-pill); border: 1px solid var(--border);
  }

  .empty { color: var(--muted); padding: 32px 0; line-height: 1.7; }
  .empty code { background: var(--surface); border: 1px solid var(--border); padding: 1px 5px; border-radius: var(--radius-sm); font-size: .9em; }

  .toast {
    position: fixed; top: 14px; right: 14px; z-index: 9999;
    background: var(--accent-hover); color: #fff;
    padding: 10px 14px; border-radius: var(--radius);
    box-shadow: var(--shadow); display: none; font-size: 14px;
  }
</style>

<div class="wrap">
  <h1>スライドビューアー</h1>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">
    <p>デッキが見つかりません。</p>
    <p><code>apps/slides/decks/</code> にファイルを追加して<br>
       <code>python3 tools/update_slides.py</code> を実行してください。</p>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const PDFJS_CDN    = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
const PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const IFRAME_W = 960, IFRAME_H = 540;
const TYPE_ICON  = { pdf: '📄', html: '🌐', pptx: '📊' };
const TYPE_LABEL = { pdf: 'PDF', html: 'HTML', pptx: 'PPTX' };

let pdfjsLib = null;

async function loadPdfJs() {
  if (pdfjsLib) return pdfjsLib;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = PDFJS_CDN; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  const lib = window['pdfjs-dist/build/pdf'];
  lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  pdfjsLib = lib;
  return lib;
}

async function renderPdfThumb(canvas, url) {
  try {
    const lib = await loadPdfJs();
    const pdf  = await lib.getDocument(url).promise;
    const page = await pdf.getPage(1);
    const wrap = canvas.parentElement;
    const w    = wrap.offsetWidth || 220;
    const vp0  = page.getViewport({ scale: 1 });
    const vp   = page.getViewport({ scale: w / vp0.width });
    canvas.width  = vp.width;
    canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  } catch {
    canvas.parentElement.innerHTML = `<span class="thumb-icon">${TYPE_ICON.pdf}</span>`;
  }
}

function setupHtmlThumb(wrap, url) {
  const iframe = document.createElement('iframe');
  Object.assign(iframe.style, {
    width: IFRAME_W + 'px', height: IFRAME_H + 'px',
    border: 'none', pointerEvents: 'none',
    transformOrigin: 'top left',
  });
  wrap.appendChild(iframe);

  const applyScale = () => {
    const scale = (wrap.offsetWidth || 220) / IFRAME_W;
    iframe.style.transform = `scale(${scale})`;
  };
  applyScale();
  iframe.addEventListener('load', applyScale);
  if (window.ResizeObserver) new ResizeObserver(applyScale).observe(wrap);

  const obs = new IntersectionObserver((entries, ob) => {
    if (entries[0].isIntersecting) { ob.disconnect(); iframe.src = url; }
  }, { rootMargin: '200px' });
  obs.observe(wrap);
}

function createCard(deck) {
  const a = document.createElement('a');
  a.className = 'deck-card';
  a.href = `./viewer.html?deck=${encodeURIComponent(deck.file)}`;

  const wrap = document.createElement('div');
  wrap.className = 'thumb-wrap';

  if (deck.type === 'pdf') {
    const canvas = document.createElement('canvas');
    wrap.appendChild(canvas);
    const obs = new IntersectionObserver((entries, ob) => {
      if (entries[0].isIntersecting) {
        ob.disconnect();
        renderPdfThumb(canvas, `./decks/${deck.file}`);
      }
    }, { rootMargin: '200px' });
    obs.observe(wrap);
  } else if (deck.type === 'html') {
    setupHtmlThumb(wrap, `./decks/${deck.file}`);
  } else {
    wrap.innerHTML = `<span class="thumb-icon">${TYPE_ICON[deck.type] || '📁'}</span>`;
  }

  const title = deck.title.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const body  = document.createElement('div');
  body.className = 'card-body';
  body.innerHTML = `<div class="card-title">${title}</div><span class="badge">${TYPE_LABEL[deck.type] || deck.type}</span>`;

  a.appendChild(wrap);
  a.appendChild(body);
  return a;
}

async function init() {
  let manifest;
  try {
    const res = await fetch('./decks/manifest.json');
    if (!res.ok) throw new Error(res.status);
    manifest = await res.json();
  } catch {
    document.getElementById('empty').style.display = '';
    return;
  }

  const grid = document.getElementById('grid');
  if (!manifest.length) {
    document.getElementById('empty').style.display = '';
    return;
  }
  manifest.forEach(deck => grid.appendChild(createCard(deck)));
}

init();
</script>
