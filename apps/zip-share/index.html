<style>
:root {
  --bg: #f3f4f6;
  --card: #fff;
  --text: #111827;
  --muted: #6b7280;
  --shadow: 0 4px 10px rgba(0,0,0,.08);
  --accent: #3b82f6;
  --danger: #ef4444;
  --success: #16a34a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif;
  background: var(--bg);
  color: var(--text);
}

.wrap {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px 16px 48px;
}

h1 {
  font-size: 22px;
  margin: 0 0 20px;
  text-align: center;
  color: var(--text);
  font-weight: 800;
  letter-spacing: -.02em;
}

.card {
  background: var(--card);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 18px;
  margin-bottom: 16px;
}

.card-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin: 0 0 14px;
}

.btn-row {
  display: flex;
  gap: 10px;
}

.pick-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 20px 10px;
  border: 2px dashed #d1d5db;
  border-radius: 12px;
  background: #f9fafb;
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
  font-family: inherit;
  font-weight: 700;
  transition: border-color .15s, background .15s, color .15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.pick-btn:hover, .pick-btn:focus-visible {
  border-color: var(--accent);
  background: #eff6ff;
  color: var(--accent);
  outline: none;
}

.pick-btn:active {
  background: #dbeafe;
}

.pick-btn svg {
  width: 28px;
  height: 28px;
}

.drop-zone {
  border: 2px dashed #d1d5db;
  border-radius: 12px;
  padding: 18px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  margin-top: 12px;
  transition: border-color .15s, background .15s, color .15s;
}

.drop-zone.drag-over {
  border-color: var(--accent);
  background: #eff6ff;
  color: var(--accent);
}

.file-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.file-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border-radius: 10px;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  animation: fadeIn .15s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: none; }
}

.file-thumb {
  width: 48px;
  height: 48px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
}

.file-icon {
  width: 48px;
  height: 48px;
  border-radius: 8px;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 22px;
}

.file-info {
  flex: 1;
  min-width: 0;
}

.file-name {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.file-size {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
}

.file-del {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: none;
  background: #fee2e2;
  color: var(--danger);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 14px;
  font-weight: 700;
  -webkit-tap-highlight-color: transparent;
  transition: background .1s;
}

.file-del:active {
  background: #fca5a5;
}

.empty-msg {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 16px 0;
}

.file-count {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 12px;
  font-weight: 600;
}

.action-btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity .15s, transform .08s;
  -webkit-tap-highlight-color: transparent;
  margin-bottom: 10px;
  letter-spacing: -.01em;
}

.action-btn:last-child {
  margin-bottom: 0;
}

.action-btn:active {
  transform: scale(.97);
}

.action-btn:disabled {
  opacity: .35;
  cursor: default;
  transform: none;
}

.btn-share {
  background: var(--accent);
  color: #fff;
  font-size: 16px;
  padding: 18px;
}

.btn-download {
  background: #f0fdf4;
  color: #15803d;
  border: 2px solid #bbf7d0;
}

.btn-mail {
  background: #fdf4ff;
  color: #7c3aed;
  border: 2px solid #e9d5ff;
}

.progress-bar {
  height: 5px;
  background: #e5e7eb;
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 14px;
  display: none;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 5px;
  transition: width .1s;
  width: 0%;
}

.toast {
  position: fixed;
  top: 14px;
  right: 14px;
  left: 14px;
  z-index: 9999;
  background: var(--success);
  color: #fff;
  padding: 12px 16px;
  border-radius: 12px;
  box-shadow: var(--shadow);
  display: none;
  font-size: 14px;
  font-weight: 700;
  text-align: center;
  max-width: 500px;
  margin: 0 auto;
}

.share-hint {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin-top: 10px;
  line-height: 1.5;
}
</style>

<div class="wrap">

  <!-- ファイル選択 -->
  <div class="card">
    <div class="card-title">ファイルを追加</div>
    <div class="btn-row">
      <button class="pick-btn" onclick="document.getElementById('photoInput').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        写真・動画
      </button>
      <button class="pick-btn" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>

        ファイル
      </button>

    <input type="file" id="fileInput" multiple style="display:none">

  <!-- ファイルリスト -->
  <div class="card">
    <div class="card-title">選択中のファイル</div>

    <div class="file-list" id="fileList">

    </div>
  </div>

  <!-- 共有 -->
  <div class="card">
    <div class="card-title">ZIPにまとめて共有</div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <button class="action-btn btn-share" id="shareBtn" disabled onclick="buildAndShare('share')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      ZIPを共有する
    </button>
    <button class="action-btn btn-mail" id="mailBtn" disabled onclick="buildAndShare('mail')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      メールで送る
    </button>
    <button class="action-btn btn-download" id="downloadBtn" disabled onclick="buildAndShare('download')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      ZIPをダウンロード
    </button>
    <p class="share-hint" id="shareHint" style="display:none">
      「ZIPを共有する」ではメール・AirDrop・LINEなどのアプリを選べます
    </p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
const files = [];
let zipCache = null;
let zipCacheKey = '';

document.getElementById('photoInput').addEventListener('change', e => {
  addFiles(e.target.files);
  e.target.value = '';
});
document.getElementById('fileInput').addEventListener('change', e => {
  addFiles(e.target.files);
  e.target.value = '';
});

const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  addFiles(e.dataTransfer.files);
});

function addFiles(fileList) {
  let added = 0;
  for (const f of fileList) {
    if (!files.find(x => x.name === f.name && x.size === f.size && x.lastModified === f.lastModified)) {
      files.push(f);
      added++;
    }
  }
  if (added > 0) {
    zipCache = null;
    renderList();
  }
}

function removeFile(idx) {
  files.splice(idx, 1);
  zipCache = null;
  renderList();
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

function getFileEmoji(name) {
  const ext = name.split('.').pop().toLowerCase();
  const map = {
    pdf: '📄', doc: '📝', docx: '📝', xls: '📊', xlsx: '📊',
    ppt: '📽', pptx: '📽', txt: '📃', zip: '🗜', gz: '🗜',
    mp3: '🎵', wav: '🎵', aac: '🎵', mp4: '🎬', mov: '🎬',
    avi: '🎬', csv: '📊', json: '🔧', xml: '🔧', html: '🌐',
    js: '💻', ts: '💻', py: '🐍',
  };
  return map[ext] || '📁';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderList() {
  const list = document.getElementById('fileList');
  const countEl = document.getElementById('fileCount');
  const hintEl = document.getElementById('shareHint');

  if (files.length === 0) {
    list.innerHTML = '<div class="empty-msg">ファイルが選択されていません</div>';
    countEl.style.display = 'none';
  } else {
    const totalSize = files.reduce((a, f) => a + f.size, 0);
    countEl.textContent = `${files.length}件 ／ 合計 ${formatSize(totalSize)}`;
    countEl.style.display = 'block';

    list.innerHTML = '';
    files.forEach((f, i) => {
      const item = document.createElement('div');
      item.className = 'file-item';
      const isImage = f.type.startsWith('image/');
      const thumb = isImage
        ? `<img class="file-thumb" src="${URL.createObjectURL(f)}" alt="">`
        : `<div class="file-icon">${getFileEmoji(f.name)}</div>`;
      item.innerHTML = `
        ${thumb}
        <div class="file-info">
          <div class="file-name">${escHtml(f.name)}</div>
          <div class="file-size">${formatSize(f.size)}</div>
        </div>
        <button class="file-del" onclick="removeFile(${i})" aria-label="削除">✕</button>`;
      list.appendChild(item);
    });
  }

  const has = files.length > 0;
  document.getElementById('shareBtn').disabled = !has;
  document.getElementById('downloadBtn').disabled = !has;
  document.getElementById('mailBtn').disabled = !has;

  const canWebShare = has && navigator.canShare;
  hintEl.style.display = canWebShare ? 'block' : 'none';
}

async function buildZip() {
  const key = files.map(f => `${f.name}:${f.size}:${f.lastModified}`).join('|');
  if (zipCache && zipCacheKey === key) return zipCache;

  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  progressBar.style.display = 'block';
  progressFill.style.width = '0%';

  const zip = new JSZip();
  const nameCount = {};
  for (const f of files) {
    let name = f.name;
    if (nameCount[name] !== undefined) {
      nameCount[name]++;
      const dotIdx = name.lastIndexOf('.');
      if (dotIdx > 0) {
        name = name.slice(0, dotIdx) + `(${nameCount[f.name]})` + name.slice(dotIdx);
      } else {
        name = name + `(${nameCount[f.name]})`;
      }
    } else {
      nameCount[f.name] = 0;
    }
    zip.file(name, f);
  }

  const blob = await zip.generateAsync(
    { type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } },
    meta => { progressFill.style.width = meta.percent.toFixed(0) + '%'; }
  );

  progressBar.style.display = 'none';
  zipCache = blob;
  zipCacheKey = key;
  return blob;
}

async function buildAndShare(mode) {
  if (files.length === 0) return;

  const btns = ['shareBtn', 'downloadBtn', 'mailBtn'].map(id => document.getElementById(id));
  btns.forEach(b => b.disabled = true);

  try {
    const blob = await buildZip();
    const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    const zipName = `files_${dateStr}.zip`;

    if (mode === 'share') {
      const zipFile = new File([blob], zipName, { type: 'application/zip' });
      if (navigator.canShare && navigator.canShare({ files: [zipFile] })) {
        await navigator.share({ files: [zipFile], title: zipName });
      } else if (navigator.share) {
        await navigator.share({ title: 'ZIPファイル', text: 'ZIPをダウンロードして使ってください' });
      } else {
        downloadBlob(blob, zipName);
        showToast('共有機能が使えないため、ダウンロードしました');
      }

    } else if (mode === 'mail') {
      downloadBlob(blob, zipName);
      const subject = encodeURIComponent('ファイルを共有します');
      const body = encodeURIComponent(
        `ZIPファイル（${zipName}）をダウンロードしました。\nメールに添付してお送りします。`
      );
      setTimeout(() => { window.location.href = `mailto:?subject=${subject}&body=${body}`; }, 600);
      showToast(`${zipName} をダウンロードしました。メールに添付してください！`);

    } else if (mode === 'download') {
      downloadBlob(blob, zipName);
      showToast(`${zipName} をダウンロードしました！`);
    }

  } catch (e) {
    if (e.name !== 'AbortError') {
      showToast('エラーが発生しました: ' + e.message, false);
    }
  } finally {
    const has = files.length > 0;
    btns.forEach(b => b.disabled = !has);
  }
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

function showToast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = ok ? '#16a34a' : '#dc2626';
  el.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.style.display = 'none'; }, 3500);
}
</script>
